name: Docker

on:
  pull_request:
  push:
    branches: ['main', 'k8s']
    tags: ['v*']

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: true

jobs:
  docker:
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: USA-RedDragon/reusable-actions/.github/workflows/docker-ci.yaml@e7afc0ee5060bc77e9a4a7d0af278f8e5716b668 # v2.0.20
    with:
      push: ${{ github.event_name != 'pull_request' }}

  docker-mesh-manager:
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: USA-RedDragon/reusable-actions/.github/workflows/docker-ci.yaml@e7afc0ee5060bc77e9a4a7d0af278f8e5716b668 # v2.0.20
    with:
      push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/k8s' }}
      image-name: usa-reddragon/meshmap-mesh-manager
      build-args: |
        BASE=/meshmap/
